    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Base typography & Canvas */
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; }
        .font-tech { font-family: 'Chakra Petch', sans-serif; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI Layer - Pointer events none allows clicking "through" to the 3D canvas if needed, 
           while auto is applied to the actual panels so you can type in them. */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-auto { pointer-events: auto; }

        /* Scanning Animation */
        .scanline { width: 100%; height: 2px; background: rgba(0, 243, 255, 0.15); position: absolute; top: 0; left: 0; animation: scan 8s linear infinite; pointer-events: none; z-index: 50;}
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* Metallic Login Panel Styles */
        .metal-casing {
            background: linear-gradient(180deg, #9ca3af 0%, #4b5563 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), inset 0 4px 6px rgba(255, 255, 255, 0.4), inset 0 -4px 6px rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 24px;
        }

        .panel-dark {
            background: linear-gradient(145deg, #1f2229 0%, #121418 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            border: 1px solid #374151;
        }

        /* Glowing Inputs */
        .input-glow-container {
            display: flex; align-items: stretch; height: 48px; border-radius: 999px; margin-bottom: 1.25rem;
            background-color: #0a0b0d; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .icon-metallic {
            background: linear-gradient(180deg, #6b7280 0%, #374151 100%);
            border: 1px solid #9ca3af; border-right: none; border-radius: 999px 0 0 999px;
            padding: 0 16px; display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 0 5px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3); z-index: 10;
        }

        .input-cyan {
            flex: 1; background: transparent; border: 2px solid #00f3ff; border-left: none;
            border-radius: 0 999px 999px 0; color: #e5e7eb; padding-left: 12px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.1); transition: all 0.2s ease;
        }

        .input-cyan:focus {
            outline: none; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(0, 243, 255, 0.3);
            background-color: rgba(0, 243, 255, 0.05);
        }

        /* Buttons */
        .btn-metal-social {
            background: linear-gradient(180deg, #4b5563 0%, #1f2937 100%); border: 2px solid #374151;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2); transition: all 0.1s;
        }
        .btn-metal-social:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1); }

        .btn-decrypt {
            background: linear-gradient(180deg, #2a2e35 0%, #111317 100%); border: 2px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), 0 0 10px rgba(212, 175, 55, 0.2), inset 0 2px 4px rgba(255,255,255,0.1); transition: all 0.1s;
        }
        .btn-decrypt:active { transform: translateY(3px); box-shadow: 0 1px 2px rgba(0,0,0,0.6), 0 0 5px rgba(212, 175, 55, 0.2); }

        /* Neon accents */
        .led-light { position: absolute; width: 3px; height: 30px; background-color: #00f3ff; box-shadow: 0 0 12px 2px #00f3ff; border-radius: 4px; }
        .text-glow { text-shadow: 0 0 8px rgba(0,243,255,0.8); }

</head>

                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd" />

                                <span class="font-bold text-xl font-tech">G</span>
                            </button>
                            <button type="button" class="w-10 h-10 rounded-lg btn-metal-social flex items-center justify-center text-[#d4af37] hover:brightness-125">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                            </button>
                            <button type="button" class="w-10 h-10 rounded-lg btn-metal-social flex items-center justify-center text-[#d4af37] hover:brightness-125">

            </div>

    <script>
        // Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 16;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance optimization
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Core Group - We shift it left (-4) so it balances the right-aligned login form!
        const coreGroup = new THREE.Group();
        // Shift left on desktop, center on mobile
        coreGroup.position.x = window.innerWidth > 1024 ? -4 : 0; 
        scene.add(coreGroup);

        // INNER CORE: Glowing Cyan Crystal
        const innerGeometry = new THREE.IcosahedronGeometry(3.5, 0);
        const innerMaterial = new THREE.MeshStandardMaterial({
            color: 0x00f3ff, emissive: 0x0088ff, emissiveIntensity: 0.9,
            roughness: 0.1, metalness: 0.9, flatShading: true
        });
        const innerCore = new THREE.Mesh(innerGeometry, innerMaterial);
        coreGroup.add(innerCore);

        // OUTER CAGE: Dark Wireframe
        const cageGeometry = new THREE.IcosahedronGeometry(5.2, 1);
        const cageMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111, emissive: 0x00f3ff, emissiveIntensity: 0.15,
            wireframe: true, transparent: true, opacity: 0.6
        });
        const cage = new THREE.Mesh(cageGeometry, cageMaterial);
        coreGroup.add(cage);

        // RING 1: Gold Orbit
        const ring1Geometry = new THREE.TorusGeometry(7.5, 0.04, 16, 100);
        const ring1Material = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
        const ring1 = new THREE.Mesh(ring1Geometry, ring1Material);
        ring1.rotation.x = Math.PI / 2.2;
        coreGroup.add(ring1);

        // RING 2: Cyan Orbit
        const ring2Geometry = new THREE.TorusGeometry(9, 0.02, 16, 100);
        const ring2Material = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.8 });
        const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
        ring2.rotation.y = Math.PI / 2.5;
        coreGroup.add(ring2);

        // PARTICLES (Data Stream)
        const particleCount = 600;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00f3ff, size: 0.12, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending
        });
        
        const particlePositions = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i++) {
            particlePositions[i] = (Math.random() - 0.5) * 40;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        const innerLight = new THREE.PointLight(0x00f3ff, 2.5, 25);
        coreGroup.add(innerLight);

        // Mouse Interactivity
        let mouseX = 0; let mouseY = 0;
        let targetX = 0; let targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotations
            innerCore.rotation.y += 0.004;
            innerCore.rotation.x += 0.002;
            cage.rotation.y -= 0.002;
            cage.rotation.z += 0.001;
            ring1.rotation.y = Math.sin(time * 0.3) * 0.3;
            ring1.rotation.z += 0.005;
            ring2.rotation.x = Math.cos(time * 0.2) * 0.4;
            ring2.rotation.z -= 0.008;
            particleSystem.rotation.y += 0.0005;

            // Parallax Mouse Follow
            targetX = mouseX * 1.5;
            targetY = mouseY * 1.5;
            coreGroup.rotation.y += 0.05 * (targetX - coreGroup.rotation.y);
            coreGroup.rotation.x += 0.05 * (targetY - coreGroup.rotation.x);
            
            // Hover effect
            coreGroup.position.y = Math.sin(time * 1.5) * 0.4;

            renderer.render(scene, camera);
        }

        // Resize Handler
        window.addEventListener('resize', () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Adjust core position for mobile vs desktop
            coreGroup.position.x = window.innerWidth > 1024 ? -4 : 0;
        });

        animate();
    </script>
</body>
</html>
